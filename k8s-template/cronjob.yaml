# CronJob 用来按计划周期性执行任务。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: demo-cronjob
  namespace: demo
spec:
  # Cron 表达式：每 5 分钟执行一次。
  schedule: "*/5 * * * *"
  # 如果上一次任务还没结束，跳过新的执行。
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: cron
              image: busybox:1.36
              command:
                - sh
                - -c
                - "date && echo hello from cronjob"

