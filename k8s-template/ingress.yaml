# Ingress 用来把 HTTP/HTTPS 域名流量转发到 Service。
# 需要集群中已经安装 Ingress Controller，例如 ingress-nginx。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-app
  namespace: demo
  annotations:
    # 如果使用 cert-manager，可以指定证书签发器。
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  # IngressClass 名称，需要和集群中的 Ingress Controller 对应。
  ingressClassName: nginx
  tls:
    - hosts:
        - demo.example.com
      # TLS 证书保存到这个 Secret。
      secretName: demo-example-com-tls
  rules:
    - host: demo.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-app
                port:
                  number: 80

