# HPA 根据 CPU/内存等指标自动调整 Deployment 副本数。
# 需要 metrics-server 正常工作。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: demo-app
  namespace: demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: demo-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # 目标 CPU 使用率为 requests.cpu 的 60%。
          averageUtilization: 60

